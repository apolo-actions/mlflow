name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_call: {}
  workflow_dispatch: {}
jobs:
  test:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      local: true
    steps:
      - name: Checkout commit
        uses: actions/checkout@v3

      - name: Login to GHCR
        if: github.actor != 'dependabot[bot]'
        uses: docker/login-action@v2.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: docker/metadata-action@v4
        with:
            images: ghcr.io/apolo-actions/mlflow
            tags: |
              type=ref,event=pr
      - name: Build Docker Image
        run: |
          docker build -t "ghcr.io/apolo-actions/mlflow:development" .

      - name: Test image
        run: |
          make run-tests IMAGE_TAG=development IMAGE_NAME=ghcr.io/apolo-actions/mlflow

      # Dependabot runs get a read-only GITHUB_TOKEN, so the registry push
      # cannot succeed; the build and test steps above still cover the change.
      - name: Push Docker Image
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          docker tag ghcr.io/apolo-actions/mlflow:development ${{ steps.meta.outputs.tags }}
          docker push ${{ steps.meta.outputs.tags }}

